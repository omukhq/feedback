name: Bug report
description: Something in an app does not work as it should.
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for the report. Issues are public, so leave out private data.
  - type: dropdown
    id: app
    attributes:
      label: App
      options:
        - airshot (Mac)
        - Flume (Mac)
        - AirBridge (Mac)
        - AirBridge (Android)
        - Klipboard (Mac)
        - PostVault (Android)
        - Gallery (Android)
        - Something else
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: In the app's About window or Settings.
      placeholder: "1.2.3"
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: System
      placeholder: "macOS 15.1 on M2, or Android 14 on Pixel 8"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to make it happen again
      placeholder: |
        1. Open …
        2. Click …
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or crash report
      description: Drag files here. A crash report from the app's Report a Problem window helps a lot.
